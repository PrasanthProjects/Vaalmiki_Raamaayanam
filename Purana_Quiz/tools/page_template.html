<title>పురాణ ప్రశ్నలు</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;500;600;700&family=Ramabhadra&display=swap">
<style>
/* Layout: a sticky Short picker, then the Short as four numbered steps (questions → voice → pictures → upload),
   every copyable text in a snippet with one big copy button. Indigo ink, marigold for actions, green for right answers. */
:root {
  --bg: #F3F2F8; --card: #FFFFFF; --ink: #1E1A2E; --muted: #6A6580; --line: #E2DFEC; --sunk: #F7F6FB;
  --act: #C77A06; --act-ink: #FFFFFF; --ok: #1E8A5A; --ok-soft: #E3F4EB; --tag: #EDEAF7;
  --display: 'Ramabhadra', 'Noto Sans Telugu', sans-serif; --body: 'Noto Sans Telugu', system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #13111C; --card: #1D1A29; --ink: #EEEBF7; --muted: #A49FB8; --line: #302C42; --sunk: #181622;
  --act: #F0A630; --act-ink: #1B1405; --ok: #4CC58C; --ok-soft: #173326; --tag: #2A2640; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #13111C; --card: #1D1A29; --ink: #EEEBF7; --muted: #A49FB8; --line: #302C42; --sunk: #181622;
  --act: #F0A630; --act-ink: #1B1405; --ok: #4CC58C; --ok-soft: #173326; --tag: #2A2640; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.6 var(--body); }
.wrap { max-width: 820px; margin: 0 auto; padding: 0 16px 80px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--act); outline-offset: 2px; }

/* top */
.top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0 10px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand h1 { font: 400 24px/1.2 var(--display); margin: 0; }
.brand span { color: var(--muted); font-size: 13px; }
.nav { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
.nav select { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); font: 500 15px var(--body); }
.nav .step { width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); font-size: 18px; }
.nav .cast { height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); white-space: nowrap; }
.nav .cast[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.jump { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
.jump a { flex: none; text-decoration: none; color: var(--ink); background: var(--tag); border-radius: 999px; padding: 5px 12px; font-size: 14px; }

/* short header */
.head { display: grid; gap: 6px; padding: 18px 0 6px; }
.head .meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.head .meta b { background: var(--tag); color: var(--ink); font-weight: 600; border-radius: 6px; padding: 1px 8px; }
.head h2 { font: 400 28px/1.25 var(--display); margin: 0; text-wrap: balance; }
.done { display: inline-flex; gap: 8px; align-items: center; font-size: 15px; width: fit-content; }
.done input { width: 20px; height: 20px; accent-color: var(--ok); }

/* sections */
section { margin-top: 26px; }
.sec { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.sec .n { width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none; }
.sec h3 { margin: 0; font-size: 19px; }
.sec.sub { margin: 18px 0 6px; }
.qcard.prev { border-style: dashed; }
.qcard.next { border: 2px solid var(--act); }
.sec.sub h3 { font-size: 17px; }
.line .say b { font-size: 13px; font-weight: 600; opacity: .75; }
.hint { color: var(--muted); font-size: 14px; margin: -4px 0 10px; }

/* quiz cards */
.qs { display: grid; gap: 12px; }
.qcard { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; }
.qtop { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.qcard .q { font-weight: 600; font-size: 17px; }
.opts { display: grid; gap: 6px; }
.opt { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; background: var(--sunk); }
.opt i { font-style: normal; font-weight: 700; width: 22px; flex: none; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right::after { content: '✓ జవాబు'; margin-left: auto; color: var(--ok); font-weight: 700; font-size: 13px; white-space: nowrap; }
.why { font-size: 15px; }
.src { font-size: 13px; color: var(--muted); border-left: 3px solid var(--act); padding-left: 8px; }

/* snippets */
.snips { display: grid; gap: 10px; }
.snip { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.snip header { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
.snip .lab { flex: 1; min-width: 0; font-weight: 600; font-size: 15px; }
.snip .lab small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
.cp { flex: none; border: 0; border-radius: 10px; padding: 9px 16px; background: var(--act); color: var(--act-ink); font-weight: 700; font-size: 15px; min-width: 104px; }
.cp.ok { background: var(--ok); color: #fff; }
.snip .txt { margin: 0; padding: 10px 12px 12px; border-top: 1px solid var(--line); background: var(--sunk); white-space: pre-wrap; word-break: break-word; font: 14px/1.6 var(--body); max-height: 7.2em; overflow: hidden; position: relative; }
.snip.open .txt { max-height: none; }
.more { display: block; width: 100%; border: 0; border-top: 1px solid var(--line); background: var(--card); color: var(--muted); padding: 7px; font-size: 13px; }
.tag { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 6px; padding: 1px 8px; margin-left: 6px; background: var(--tag); }
.tag.best { background: var(--ok-soft); color: var(--ok); }

/* voice lines */
.lines { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.line { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line); }
.line:first-child { border-top: 0; }
.line .who { flex: none; width: 64px; font-weight: 700; font-size: 14px; }
.line .who.c { color: var(--act); }
.line .say { flex: 1; min-width: 0; font-size: 15px; }
.line .cp { min-width: 0; padding: 7px 12px; font-size: 14px; }
.allbar { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
/* shot list */
.shots { display: grid; gap: 10px; }
.shot { background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 8px; }
.shot.k-lip { border-left-color: var(--act); }
.shot.k-vo { border-left-color: var(--ok); }
.shot .sh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.shot .num { width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none; }
.shot .part { color: var(--ink); font-weight: 700; font-size: 15px; }
.chip { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 700; background: var(--tag); color: var(--ink); }
.chip.one { background: #FDEBD0; color: #8A5300; }
.chip.two { background: var(--ok-soft); color: var(--ok); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip.one { background: #3A2A10; color: #F0B860; } }
:root[data-theme="dark"] .chip.one { background: #3A2A10; color: #F0B860; }
.kv { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 4px 8px; font-size: 14px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; word-break: break-word; }
.kv code { font: 600 13px/1.5 var(--body); background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; }
.shot .say { background: var(--sunk); border-radius: 10px; padding: 8px 10px; font-size: 16px; display: flex; gap: 10px; align-items: center; }
.shot .say span { flex: 1; min-width: 0; }
.shot .say .cp { min-width: 0; padding: 7px 12px; font-size: 14px; }
.legend { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.steps { margin: 0 0 12px; padding-left: 22px; font-size: 14px; color: var(--muted); }
.steps li { margin: 3px 0; }
.group { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: grid; gap: 10px; }
.group h4 { margin: 0; font-size: 16px; }
.group h4 small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }

/* timeline */
.tl { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 10px; border-top: 1px solid var(--line); text-align: left; vertical-align: top; }
th { border-top: 0; color: var(--muted); font-weight: 600; font-size: 13px; }
td:first-child { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); }
details.tld summary { cursor: pointer; color: var(--muted); font-size: 14px; margin: 8px 0; }

.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s; }
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
@media (max-width: 420px) { .line { flex-wrap: wrap; } .line .who { width: auto; } .cp { min-width: 88px; } }
</style>

<div class="wrap">
  <div class="top">
    <div class="brand"><h1>పురాణ ప్రశ్నలు</h1><span>తాతయ్య, చిన్ని క్విజ్ Shorts · రామాయణం (మహాభారతం, భాగవతం తరువాత)</span></div>
    <div class="nav">
      <button class="step" id="prev" aria-label="ముందు Short">‹</button>
      <select id="pick" aria-label="Short ఎంచుకోండి"></select>
      <button class="step" id="next" aria-label="తరువాతి Short">›</button>
      <button class="cast" id="castBtn" aria-pressed="false">పాత్రలు ⭐</button>
    </div>
    <nav class="jump" id="jump" aria-label="ఈ Short లో"></nav>
  </div>
  <div id="panel"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function () {
  var D = JSON.parse(document.getElementById('data').textContent);
  var $ = function (id) { return document.getElementById(id); };
  var store = { get: function (k) { try { return localStorage.getItem('purana-quiz-' + k); } catch (e) { return null; } },
                set: function (k, v) { try { localStorage.setItem('purana-quiz-' + k, v); } catch (e) {} } };
  var TEXTS = [];
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function keep(t) { TEXTS.push(t); return TEXTS.length - 1; }
  function cpBtn(t, label) { return '<button class="cp" data-t="' + keep(t) + '">' + (label || 'కాపీ') + '</button>'; }
  function snip(label, sub, text, tag) {
    return '<div class="snip"><header><div class="lab">' + esc(label) + (tag || '') + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</div>'
      + cpBtn(text) + '</header><pre class="txt">' + esc(text) + '</pre><button class="more">పూర్తిగా చూపించు</button></div>';
  }
  var toastTimer;
  function toast(msg) { var t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1600); }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.append(ta); ta.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove(); return ok;
  }
  function copy(btn) {
    var text = TEXTS[+btn.dataset.t], label = btn.textContent;
    var done = function () { btn.classList.add('ok'); btn.textContent = '✓ కాపీ'; toast('కాపీ అయింది – ఇప్పుడు పేస్ట్ చేయండి');
      setTimeout(function () { btn.classList.remove('ok'); btn.textContent = label; }, 1500); };
    var fail = function () { if (fallbackCopy(text)) return done(); toast('కాపీ కాలేదు – టెక్స్ట్‌ను నొక్కి పట్టి కాపీ చేయండి');
      var s = btn.closest('.snip'); if (s) s.classList.add('open'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fail); else fail();
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('.cp'); if (b) return copy(b);
    var m = e.target.closest('.more'); if (m) { var s = m.closest('.snip'); s.classList.toggle('open'); m.textContent = s.classList.contains('open') ? 'తక్కువ చూపించు' : 'పూర్తిగా చూపించు'; }
  });

  var cur = +(store.get('cur') || 0), cast = false;
  if (!D.shorts[cur]) cur = 0;
  function label(s) { return (store.get('done-' + s.id) ? '✓ ' : '') + s.id + ' · ' + s.title + ' — ' + s.book; }
  function fillPick() { $('pick').innerHTML = D.shorts.map(function (s, i) { return '<option value="' + i + '">' + esc(label(s)) + '</option>'; }).join(''); $('pick').value = cur; }
  function go(i) { cur = (i + D.shorts.length) % D.shorts.length; cast = false; store.set('cur', cur); render(); window.scrollTo(0, 0); }
  $('pick').onchange = function () { go(+this.value); };
  $('prev').onclick = function () { go(cur - 1); };
  $('next').onclick = function () { go(cur + 1); };
  $('castBtn').onclick = function () { cast = !cast; render(); };

  function voiceSnips() {
    return '<p class="hint">' + esc(D.voiceHow) + '</p><div class="snips">'
      + D.voices.map(function (v) {
        return snip(v.name + ' గొంతు — వివరణ', v.en + ' పేరుతో సేవ్ చేయండి', v.desc, '<span class="tag best">Prompt</span>')
          + snip(v.name + ' గొంతు — తెలుగు శాంపిల్', 'Text to preview · సెట్టింగ్‌లు: ' + v.sets, v.sample);
      }).join('') + '</div>';
  }

  function render() {
    TEXTS = []; fillPick(); $('castBtn').setAttribute('aria-pressed', cast);
    if (cast) {
      $('jump').innerHTML = '';
      var USE = { hook: 'Short మొదటి లైన్ (హుక్) కి', talk: 'మిగతా లైన్లు అన్నిటికీ' };
      function trio(title, sub, key, start, end, vid, tag) {
        return '<div class="group"><h4>' + esc(title) + '<small>' + esc(sub) + '</small></h4>'
          + snip('మొదటి ఇమేజ్ (start frame)', key + '_start.png', start, tag)
          + snip('చివరి ఇమేజ్ (end frame)', key + '_end.png', end, tag)
          + snip('వీడియో (రెండు ఇమేజ్‌లు జత చేసి)', key + '.mp4', vid, tag) + '</div>';
      }
      $('panel').innerHTML = '<div class="head"><h2>పాత్రలు – ఒక్కసారే చేయాల్సినవి</h2><p class="hint">ఇవి అన్ని Shorts లోనూ అదే. ఇక్కడి పేర్లతో సేవ్ చేయండి – ప్రతి Short షాట్ లిస్ట్ ఈ పేర్లనే అడుగుతుంది. అన్ని ఇమేజ్‌లలో ముఖం నేరుగా కెమెరా వైపు, స్పష్టమైన నవ్వుతో.</p></div>'
        + '<div class="sec"><span class="n">1</span><h3>రిఫరెన్స్ షీట్లు</h3></div><p class="hint">ముందు ఇవి చేయండి; తరువాతి ఇమేజ్‌లన్నిటికీ వీటిని రిఫరెన్స్‌గా జత చేయండి – ముఖాలు మారవు.</p><div class="snips">'
        + D.cast.map(function (c) { return snip(c.name + ' – రిఫరెన్స్', c.key + '.png', c.prompt); }).join('') + '</div>'
        + '<div class="sec sub"><span class="n">2</span><h3>👤 ఒక్కరే – మాట్లాడే షాట్లు (లిప్‌సింక్)</h3></div><p class="hint">వీడియోలో ఒక్కరే ఉంటారు, కాబట్టి లిప్‌సింక్ ఆ నోరే కదుపుతుంది. మొదటి, చివరి ఇమేజ్ చేసి, ElevenLabs వీడియోలో రెండూ జత చేయండి.</p><div class="snips">'
        + D.cast.map(function (c) {
          return c.shots.map(function (x) {
            return trio(c.name + ' – ' + (x.kind === 'hook' ? 'హుక్' : 'మాట్లాడుతూ'), USE[x.kind], c.key + '_' + x.kind, x.start, x.end, x.vid, '<span class="tag best">ఒక్కరే</span>');
          }).join('');
        }).join('') + '</div>'
        + '<div class="sec sub"><span class="n">3</span><h3>👥 ఇద్దరూ – మాటలు లేని చోట్ల</h3></div><p class="hint">తెరపై ఎవరూ మాట్లాడని చోట్ల మాత్రమే (నోళ్ళు మూసి) – లిప్‌సింక్ అక్కర్లేదు, ఆడియో మీద పెడితే చాలు.</p><div class="snips">'
        + D.both.map(function (b) { return trio(b.label, b.key + ' – ఇద్దరూ', b.key, b.start, b.end, b.vid, '<span class="tag">ఇద్దరూ</span>'); }).join('') + '</div>'
        + '<div class="sec sub"><span class="n">4</span><h3>🔊 గొంతులు</h3></div>' + voiceSnips();
      return;
    }
    var s = D.shorts[cur], dub = store.get('done-' + s.id);
    $('jump').innerHTML = [['q', '1 ప్రశ్నలు'], ['v', '2 షాట్ లిస్ట్'], ['p', '3 జవాబు చిత్రాలు'], ['u', '4 అప్‌లోడ్']]
      .map(function (x) { return '<a href="#sec-' + x[0] + '">' + x[1] + '</a>'; }).join('');
    var h = '<div class="head"><div class="meta"><b>' + esc(s.book) + '</b><span>' + s.qs.length + ' ప్రశ్నలు</span><span>సుమారు ' + esc(s.len) + '</span><span>నిలువు 9:16</span></div>'
      + '<h2>' + esc(s.id + ' · ' + s.title) + '</h2>'
      + '<label class="done"><input type="checkbox" id="doneBox"' + (dub ? ' checked' : '') + '> ఈ Short పూర్తైంది</label></div>';

    function qcard(q, top, who) {
      return '<div class="qcard"><div class="qtop"><span>' + top + '</span><span>' + who + '</span></div>'
        + '<div class="q">' + esc(q.q) + '</div><div class="opts">'
        + q.opts.map(function (o, k) { return '<div class="opt' + ('ABC'[k] === q.ans ? ' right' : '') + '"><i>' + 'ABC'[k] + '</i><span>' + esc(o) + '</span></div>'; }).join('')
        + '</div><div class="why">' + esc(q.why) + '</div><div class="src">మూలం: ' + esc(q.src) + '</div></div>';
    }
    h += '<section id="sec-q"><div class="sec"><span class="n">1</span><h3>ప్రశ్నలు, జవాబులు</h3></div><p class="hint">తెరపై కార్డులు ఇలా రావాలి. ✓ ఉన్నది జవాబు; కింద మూలం. Shorts ఈ వరుసలోనే అప్‌లోడ్ చేయండి — చివరి కామెంట్ ప్రశ్న జవాబు తరువాతి Short మొదట్లో వస్తుంది.</p><div class="qs">'
      + (s.prev ? qcard(s.prev, '⏮ మొదట: గత ప్రశ్న జవాబు', s.prevId + ' లో అడిగింది · తాతయ్య చెబుతారు').replace('qcard', 'qcard prev') : '')
      + s.qs.map(function (q, i) {
        return '<div class="qcard"><div class="qtop"><span>ప్రశ్న ' + (i + 1) + ' / ' + s.qs.length + '</span><span>' + (q.who === 'T' ? 'తాతయ్య' : 'చిన్ని') + ' అడుగుతారు</span></div>'
          + '<div class="q">' + esc(q.q) + '</div><div class="opts">'
          + q.opts.map(function (o, k) { return '<div class="opt' + ('ABC'[k] === q.ans ? ' right' : '') + '"><i>' + 'ABC'[k] + '</i><span>' + esc(o) + '</span></div>'; }).join('')
          + '</div><div class="why">' + esc(q.why) + '</div><div class="src">మూలం: ' + esc(q.src) + '</div></div>';
      }).join('')
      + (s.next ? qcard(s.next, '💬 చివర: కామెంట్ ప్రశ్న', 'జవాబు తెరపై చెప్పకూడదు — తరువాతి Short లో').replace('qcard', 'qcard next') : '')
      + '</div><details class="tld"><summary>సెకను వారీ టైమ్‌లైన్ చూడండి</summary><div class="tl"><table><tr><th>సమయం</th><th>భాగం</th><th>ఎవరు</th><th>తెరపై</th></tr>'
      + s.rows.map(function (r) { return '<tr><td>' + esc(r.t) + '</td><td>' + esc(r.part) + '</td><td>' + esc(r.who || '–') + '</td><td>' + esc(r.screen).replace(/\n/g, '<br>') + '</td></tr>'; }).join('')
      + '</table></div></details></section>';

    var DO = { lip: '👄 లిప్‌సింక్', vo: '🔊 ఆడియో మాత్రమే', none: '⏱️ మాటలు లేవు' };
    var CH = { 'ఒక్కరే': 'one', 'ఇద్దరూ': 'two', 'చిత్రం': '' };
    h += '<section id="sec-v"><div class="sec"><span class="n">2</span><h3>షాట్ లిస్ట్ – వరుసగా</h3></div>'
      + '<ol class="steps"><li>పాత్రలు ⭐ పేజీలోని ఇమేజ్‌లు, 6 వీడియోలు ఒక్కసారి చేసి ఉంచండి.</li><li>ElevenLabs: కింది బటన్లతో తాతయ్య లైన్లు, చిన్ని లైన్లు వేరుగా కాపీ చేసి, ఒక్కో లైన్ నంబర్‌తో సేవ్ చేయండి (ఉదా: 03_chinni.mp3).</li><li>👄 షాట్: ఆ ఒక్కరి వీడియో + ఆ ఆడియో → లిప్‌సింక్.</li><li>🔊 షాట్: ఇద్దరి వీడియో / జవాబు వీడియో మీద ఆడియో మాత్రమే.</li><li>ఎడిటర్‌లో నంబర్ వరుసలో పెట్టి, "తెరపై" టెక్స్ట్ పెట్టండి.</li></ol>'
      + '<div class="allbar">' + cpBtn(s.byVoice.T, 'తాతయ్య లైన్లు అన్నీ') + cpBtn(s.byVoice.C, 'చిన్ని లైన్లు అన్నీ') + '</div>'
      + '<div class="legend"><span class="chip one">ఒక్కరే</span> మాట్లాడేవారు మాత్రమే తెరపై · <span class="chip two">ఇద్దరూ</span> నోళ్ళు మూసి · <span class="chip">చిత్రం</span> జవాబు చిత్రం</div><div class="shots">'
      + s.shots.map(function (x) {
        return '<div class="shot k-' + x.kind + '"><div class="sh"><span class="num">' + x.n + '</span><span class="part">' + esc(x.part) + '</span>'
          + '<span class="chip ' + CH[x.cast] + '">' + esc(x.cast) + '</span><span>' + esc(x.t) + ' · ' + x.d + ' సె.</span></div>'
          + '<dl class="kv"><dt>ఇమేజ్</dt><dd><code>' + esc(x.img) + '</code></dd><dt>వీడియో</dt><dd>' + esc(x.vid) + '</dd>'
          + '<dt>గొంతు</dt><dd>' + DO[x.kind] + (x.who ? ' – <b>' + esc(x.who) + '</b>' + (x.file ? ' · <code>' + esc(x.file) + '</code>' : '') : '') + '</dd>'
          + '<dt>తెరపై</dt><dd>' + esc(x.screen).replace(/\n/g, '<br>') + '</dd></dl>'
          + (x.say ? '<div class="say"><span>' + esc(x.say) + '</span>' + cpBtn(x.say) + '</div>' : '')
          + '</div>';
      }).join('') + '</div>'
      + '<details class="tld"><summary>🎙️ గొంతులు ఇంకా చేయలేదా? (ఒక్కసారే)</summary>' + voiceSnips() + '</details></section>';

    h += '<section id="sec-p"><div class="sec"><span class="n">3</span><h3>ఈ Short జవాబు చిత్రాలు</h3></div><p class="hint">ప్రతి జవాబుకు మొదటి, చివరి ఇమేజ్ – ElevenLabs వీడియోలో రెండూ జత చేయండి. చిత్రాల్లో అక్షరాలు వద్దు – కార్డులు ఎడిటర్‌లో.</p><div class="snips">'
      + s.answers.map(function (a) {
        var q = a.label.indexOf('గత') === 0 ? s.prev : s.qs[+a.label.split(' ')[1] - 1];
        return '<div class="group"><h4>' + esc(a.label) + '<small>' + esc(q ? q.opts['ABC'.indexOf(q.ans)] : '') + '</small></h4>'
          + snip('మొదటి ఇమేజ్ (start frame)', '', a.img, '<span class="tag best">ఇమేజ్</span>')
          + snip('చివరి ఇమేజ్ (end frame)', '', a.end, '<span class="tag best">ఇమేజ్</span>')
          + snip('వీడియో (రెండు ఇమేజ్‌లు జత చేసి)', '', a.vid) + '</div>';
      }).join('') + '</div></section>';

    h += '<section id="sec-u"><div class="sec"><span class="n">4</span><h3>అప్‌లోడ్</h3></div><div class="snips">'
      + snip('టైటిల్', '', s.ytitle) + snip('వివరణ', 'మూలాలు, కామెంట్ ప్రశ్న, హ్యాష్‌ట్యాగ్‌లతో', s.desc)
      + (s.pin ? snip('📌 పిన్ కామెంట్', 'అప్‌లోడ్ అయిన వెంటనే కామెంట్ చేసి Pin చేయండి', s.pin, '<span class="tag best">ముఖ్యం</span>')
        + snip('✅ జవాబు రిప్లై', 'తరువాతి Short వచ్చాక, పిన్ కామెంట్ కింద రిప్లై; <లింక్> దగ్గర ఆ Short లింక్', s.reveal) : '')
      + '</div></section>';
    $('panel').innerHTML = h;
    $('doneBox').onchange = function () { store.set('done-' + s.id, this.checked ? '1' : ''); fillPick(); };
  }
  render();
})();
</script>
